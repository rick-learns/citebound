name: Bug report
description: Something does not work as documented.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the question you asked, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. citebound serve
        2. Ask "..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `citebound version`
